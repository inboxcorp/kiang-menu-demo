<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ร้านเกียง — QR โต๊ะ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;
       margin:0;background:#f5f2ec;color:#1d1a16}
  .bar{padding:16px;background:#fff;border-bottom:1px solid #e5ded2;display:flex;
       gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:2}
  .bar label{font-size:12px;color:#7c7368;display:block;margin-bottom:3px}
  input{padding:8px 10px;border:1px solid #ddd5c8;border-radius:8px;font-size:14px;font-family:inherit}
  #url{width:min(420px,60vw)}
  button{padding:9px 16px;border:0;border-radius:8px;background:#c2410c;color:#fff;
         font-weight:700;font-size:14px;font-family:inherit;align-self:flex-end}
  .sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px;max-width:820px;margin:0 auto}
  .card{background:#fff;border:1px solid #e5ded2;border-radius:16px;padding:18px;text-align:center;
        break-inside:avoid;page-break-inside:avoid}
  .card h3{margin:0 0 2px;font-size:15px}
  .card .t{font-size:30px;font-weight:800;margin:2px 0 10px}
  .card canvas,.card img{margin:0 auto}
  .card p{font-size:11px;color:#7c7368;margin:10px 0 0;line-height:1.5}
  @media print{ .bar{display:none} body{background:#fff} .sheet{gap:10px} }
</style>
</head>
<body>
<div class="bar">
  <div><label>Endpoint / LIFF URL</label>
    <input id="url" value="https://liff.line.me/PASTE_YOUR_LIFF_ID"></div>
  <div><label>จำนวนโต๊ะ</label><input id="n" type="number" value="8" min="1" max="60" style="width:80px"></div>
  <button onclick="gen()">สร้าง QR</button>
  <button onclick="print()" style="background:#1d1a16">พิมพ์</button>
</div>
<div class="sheet" id="sheet"></div>
<script>
function gen(){
  const base = document.getElementById('url').value.trim().replace(/\/+$/,'');
  const n = +document.getElementById('n').value;
  const s = document.getElementById('sheet'); s.innerHTML='';
  for(let i=1;i<=n;i++){
    const target = base + '?table=' + i;
    const c = document.createElement('div');
    c.className='card';
    c.innerHTML = '<h3>🍜 ร้านเกียง · Kiang</h3><div class="t">โต๊ะ '+i+'</div>'+
                  '<div class="q"></div>'+
                  '<p>สแกนเพื่อเพิ่มเพื่อน LINE<br>และเปิดเมนูโต๊ะนี้</p>';
    s.appendChild(c);
    new QRCode(c.querySelector('.q'), {text:target, width:180, height:180,
      correctLevel: QRCode.CorrectLevel.M});
  }
}
gen();
</script>
</body>
</html>
